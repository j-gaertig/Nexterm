name: Build Android APK (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Must be higher than the version code installed on your phone; increase it for each APK
        required: true
        type: number

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed Galaxy APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Configure release signing
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub secret is missing: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build arm64-v8a APK
        working-directory: mobile
        shell: bash
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=${VERSION_LINE%%+*}
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer."
            exit 1
          fi
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE"
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../artifacts/nexterm-${VERSION_NAME}-${VERSION_CODE}-arm64-v8a.apk"
          echo "Built Nexterm $VERSION_NAME+$VERSION_CODE for arm64-v8a"

      - name: Remove signing files
        if: always()
        run: rm -f mobile/android/app/release.keystore mobile/android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexterm-android-arm64-v8a-${{ inputs.version_code }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
